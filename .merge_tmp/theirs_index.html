<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Medication Tracker</h1>

        <div class="controls">
            <div class="filter-buttons" role="tablist" aria-label="Filter medications by status">
                <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
                <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
            </div>
            <button id="add-btn" class="add-btn">+ Add Medication</button>
        </div>

        <div id="medication-list" class="medication-list" aria-live="polite">
            <div class="loading">Loading medications...</div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="medication-modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Add Medication</h2>
                <button class="close-btn" data-close-modal aria-label="Close">&times;</button>
            </div>
            <form id="medication-form">
                <input type="hidden" id="medication-id">
                <div class="form-group">
                    <label for="medication-name">Medication Name *</label>
                    <input type="text" id="medication-name" required placeholder="e.g., Amoxicillin">
                </div>
                <div class="form-group">
                    <label for="medication-dosage">Dosage *</label>
                    <input type="text" id="medication-dosage" required placeholder="e.g., 500mg">
                </div>
                <div class="form-group">
                    <label for="medication-frequency">Frequency *</label>
                    <input type="text" id="medication-frequency" required placeholder="e.g., twice daily">
                </div>
                <div class="form-group">
                    <label for="medication-start-date">Start Date</label>
                    <input type="date" id="medication-start-date">
                </div>
                <div class="form-group">
                    <label for="medication-end-date">End Date</label>
                    <input type="date" id="medication-end-date">
                </div>
                <div class="form-group">
                    <label for="medication-status">Status</label>
                    <select id="medication-status">
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" data-close-modal>Cancel</button>
                    <button type="submit" class="save-btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="delete-modal" role="dialog" aria-labelledby="delete-title" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <h2 id="delete-title">Confirm Delete</h2>
                <button class="close-btn" data-close-delete aria-label="Close">&times;</button>
            </div>
            <p id="delete-message" style="margin-bottom: 20px;">Are you sure you want to delete this medication? This action cannot be undone.</p>
            <div class="form-actions">
                <button class="cancel-btn" data-close-delete>Cancel</button>
                <button id="delete-confirm-btn" class="save-btn" style="background: #dc3545;">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/medication-form.js"></script>
    <script src="js/delete-dialog.js"></script>
    <script src="js/medication-list.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
